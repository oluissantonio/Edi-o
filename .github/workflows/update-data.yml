name: Atualizar indicadores e notícias

on:
  schedule:
    - cron: '17 10 * * *' # todos os dias, 07:17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit
        run: |
          if git diff --quiet data/daily.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          git commit -m "Atualiza indicadores e notícias do dia"
          git push
